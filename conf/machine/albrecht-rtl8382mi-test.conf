#@TYPE: Machine
#@NAME: Albrecht RTL8382MI test switch
#@DESCRIPTION: 20 port Gigabit switch on a Realtek RTL8382M, 16 MiB SPI-NOR.

require conf/machine/include/rtl83xx.inc

# The .dts is added to the kernel tree by
# 0008-realtek-dts-add-albrecht-rtl8382mi-test-*.patch.
KERNEL_DEVICETREE = "realtek/rtl8382_albrecht_rtl8382mi-test.dtb"
RTL_DTB = "rtl8382_albrecht_rtl8382mi-test.dtb"

# The stock Realtek SDK U-Boot expects the same uImage magic as the Zyxel one
# (AlbrechtL/openwrt rtl8382mi-test: UIMAGE_MAGIC in realtek/image/rtl838x.mk).
RTL_UIMAGE_MAGIC = "0x83800000"

# -----------------------------------------------------------------------------
# Flash image
# -----------------------------------------------------------------------------
# Partition map of the 16 MiB SPI-NOR (rtl8382_albrecht_rtl8382mi-test.dts, as
# changed by 0009). Stock names from the loader's "flshow" in brackets:
#
#   0x000000 u-boot       0xe0000  [LOADER] read-only, never written
#   0x0e0000 u-boot-env   0x10000  [BDINFO]
#   0x0f0000 sysinfo      0x10000  [SYSINFO] read-only
#   0x100000 data        0x200000  [JFFS2_CFG + JFFS2_LOG] JFFS2 overlay upper
#                                  layer, kept on upgrade
#   0x300000 firmware    0xd00000  [RUNTIME1 + RUNTIME2] uImage | pad to erase
#                                  block | squashfs
#
# As on the GS1900 the two stock image slots are one "firmware" partition, so
# there is no A/B.
RTL_FIRMWARE_SIZE = "0xd00000"
RTL_DATA_SIZE = "0x200000"
RTL_FLASH_ERASEBLOCK = "0x10000"

# -----------------------------------------------------------------------------
# Board extras
# -----------------------------------------------------------------------------
# The loader sets up the port LEDs too late and the kernel has no driver for
# the RTL838x LED shift register, so the ports stay dark without this.
MACHINE_EXTRA_RRECOMMENDS += "rtl83xx-port-leds"
