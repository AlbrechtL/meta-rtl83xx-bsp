# Buttons and switches described as "gpio-keys-polled" in the device tree,
# delivered to userspace as /dev/input/event*.
#
# The GPIOs themselves (the SoC's GPIO_REALTEK_OTTO, and I2C_GPIO plus
# GPIO_PCA953X for boards with an I2C expander) are already in defconfig.
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_GPIO_POLLED=y
