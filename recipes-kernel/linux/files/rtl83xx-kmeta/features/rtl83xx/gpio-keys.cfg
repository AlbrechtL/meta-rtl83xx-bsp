# Buttons and switches described as "gpio-keys-polled" in the device tree,
# delivered to userspace as /dev/input/event*.
#
# The GPIOs themselves (the SoC's GPIO_REALTEK_OTTO, and I2C_GPIO plus
# GPIO_PCA953X for boards with an I2C expander) are already enabled by the
# base configuration.
#
# defconfig has INPUT off. Turning it on brings the default-y input drivers
# with it, and none of them has hardware on these boards.
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_GPIO_POLLED=y
# CONFIG_INPUT_LEDS is not set
# CONFIG_KEYBOARD_ATKBD is not set
# CONFIG_INPUT_MOUSE is not set
# CONFIG_HID_SUPPORT is not set
