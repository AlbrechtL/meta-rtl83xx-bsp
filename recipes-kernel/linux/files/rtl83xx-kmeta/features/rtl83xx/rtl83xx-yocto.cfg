# Policy deltas over OpenWrt's kernel configuration.
#
# Only symbols where this build genuinely differs from OpenWrt belong here.
# Anything OpenWrt already gets right comes from defconfig -- SERIAL_8250,
# BLK_DEV_INITRD, TMPFS, MTD, BINFMT_ELF, BINFMT_SCRIPT, UNIX98_PTYS and
# SERIAL_EARLYCON are all =y in the merged base and are deliberately not
# repeated.

# OpenWrt manages /dev its own way. busybox' inittab does
# "mount -t devtmpfs devtmpfs /dev", and the kernel needs /dev/console to exist
# when it execs init.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# "[    0.000000] " prefixes on every printk. Off in OpenWrt's config.
CONFIG_PRINTK_TIME=y

# Nothing in the merged base is =m -- every driver is built in -- so the module
# loader only adds kernel size and pulls in Yocto's depmod and module-packaging
# machinery. Flip this back on when something actually needs to be =m.
# CONFIG_MODULES is not set

# Set by OpenWrt's target config. It does not change vmlinux.bin (objcopy -O
# binary drops non-alloc sections) but noticeably slows every kernel build.
#
# DEBUG_INFO itself is a promptless bool (lib/Kconfig.debug:227) driven by the
# "Debug information" choice, so "# CONFIG_DEBUG_INFO is not set" is a no-op --
# the choice has to be pointed at None instead.
CONFIG_DEBUG_INFO_NONE=y
