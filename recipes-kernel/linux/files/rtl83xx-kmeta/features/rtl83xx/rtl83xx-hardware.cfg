# Board hardware symbols that must never disappear silently.
#
# Every symbol here is ALSO set by defconfig (the OpenWrt generic+target
# merge). The duplication is deliberate: arriving through a "kconf hardware"
# fragment is what makes do_kernel_configcheck report it if a future Kconfig or
# dependency change drops it. This file is a tripwire, not a source of truth.
#
# It exists because exactly this failure went unnoticed: CONFIG_NET was absent
# from the old target-only defconfig, --allnoconfig forced it to n, and the
# whole DSA/PHY/ethernet tree vanished without a single warning.

# Core networking. NETDEVICES depends on NET; ETHERNET depends on NETDEVICES.
CONFIG_NET=y
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y

# The rtl838x MAC sits inside "if NET_VENDOR_REALTEK" in
# drivers/net/ethernet/realtek/Kconfig, so that gate matters as much as the
# driver symbol itself.
CONFIG_NET_VENDOR_REALTEK=y
CONFIG_NET_RTL838X=y

# DSA switch fabric and the Realtek Otto tag driver.
CONFIG_NET_DSA=y
CONFIG_NET_DSA_RTL83XX=y
CONFIG_NET_DSA_TAG_RTL_OTTO=y
CONFIG_NET_SWITCHDEV=y

# PHY layer used by the switch ports.
CONFIG_PHYLIB=y
CONFIG_PHYLINK=y
CONFIG_REALTEK_PHY=y
CONFIG_MDIO_REALTEK_OTTO=y

# Console. The DT uart is compatible = "ns16550a" (rtl838x.dtsi).
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y

# SPI-NOR flash.
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y

# The image pipeline concatenates the DTB onto vmlinux.bin and relies on the
# linker reserving __appended_dtb at the end of the loadable image.
CONFIG_MIPS_RAW_APPENDED_DTB=y
